<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сучасний IT-квіз</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <!-- Екран початку -->
    <div id="start-screen" class="screen">
        <div class="badge">💡 IT-Quiz</div>
        <h2>Ласкаво просимо!</h2>
        <p>Перевір свої знання з JavaScript. На кожне запитання дається 10 секунд.</p>
        
        <div class="difficulty-box">
            <button class="diff-btn active" data-level="easy">Легко</button>
            <button class="diff-btn" data-level="medium">Середньо</button>
            <button class="diff-btn" data-level="hard">Складно</button>
        </div>

        <button id="start-btn" class="main-btn">Почати гру</button>
    </div>
    
    <!-- Екран квізу -->
    <div id="quiz-screen" class="screen" style="display:none;">
        <div class="quiz-header">
            <div id="score-box">Бали: <span id="score-count">0</span></div>
            <div id="timer-box">⏳ <span id="timer-count">10</span>с</div>
        </div>
      
        <h2 id="question-text">Запитання</h2>
        <div id="answers-container"></div>
    </div>
    
    <!-- Екран результатів -->
    <div id="result-screen" class="screen" style="display: none;">
        <div class="badge">🏆 Результат</div>
        <h2>Гру завершено!</h2>
        <p id="result-text"></p>
        <button id="restart-btn" class="main-btn">Спробувати знову</button>
   </div>
</div>

<script src="script.js"></script>
</body>
</html>
